name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run tests
        run: pytest --cov=godot_project_doctor --cov-report=term-missing --cov-fail-under=80

  # Guards against drift between the Python CLI and the GDScript editor addon:
  # both scan tests/parity/fixture_project and must match tests/parity/expected.json.
  parity:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.5.1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdoctor
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot-bin"
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-extract
          mv "/tmp/godot-extract/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"

      - name: CLI scan (pristine checkout)
        run: |
          gdoctor scan tests/parity/fixture_project \
            --format json --output /tmp/cli_report.json --fail-on none

      - name: Addon scan (headless Godot)
        run: |
          "$HOME/godot-bin/godot" --version
          mkdir -p tests/parity/fixture_project/addons
          cp -r godot-addon/addons/godot_project_doctor tests/parity/fixture_project/addons/
          cp tests/parity/run_addon_scan.gd tests/parity/fixture_project/addons/run_addon_scan.gd
          "$HOME/godot-bin/godot" --headless \
            --path tests/parity/fixture_project \
            --script res://addons/run_addon_scan.gd \
            > /tmp/addon_out.txt 2>&1 || true
          cat /tmp/addon_out.txt

      - name: Compare CLI vs addon vs golden
        run: |
          python tests/parity/compare.py \
            --cli /tmp/cli_report.json \
            --addon /tmp/addon_out.txt \
            --expected tests/parity/expected.json

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/godot_project_doctor

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Install wheel and smoke-test CLI
        run: |
          pip install dist/*.whl
          gdoctor --help
          gdoctor --version
          gdoctor scan --help
          gdoctor graph --help
          gdoctor context --help

      - name: Smoke-test with CP949 encoding
        run: |
          mkdir -p /tmp/smoke_project
          printf '[application]\nconfig/name="Smoke"\n' > /tmp/smoke_project/project.godot
          PYTHONIOENCODING=cp949 gdoctor scan /tmp/smoke_project 2>&1 | grep -v "^Traceback" || true
          PYTHONIOENCODING=cp949 gdoctor graph /tmp/smoke_project 2>&1 | grep -v "^Traceback" || true
          PYTHONIOENCODING=cp949 gdoctor context /tmp/smoke_project 2>&1 | grep -v "^Traceback" || true
          echo "CP949 smoke test passed"
