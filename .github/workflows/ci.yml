name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run tests
        run: pytest --cov=godot_project_doctor --cov-report=term-missing --cov-fail-under=80

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/godot_project_doctor

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Install wheel and smoke-test CLI
        run: |
          pip install dist/*.whl
          gdoctor --help
          gdoctor --version
          gdoctor scan --help
          gdoctor graph --help
          gdoctor context --help

      - name: Smoke-test with CP949 encoding
        run: |
          mkdir -p /tmp/smoke_project
          printf '[application]\nconfig/name="Smoke"\n' > /tmp/smoke_project/project.godot
          PYTHONIOENCODING=cp949 gdoctor scan /tmp/smoke_project 2>&1 | grep -v "^Traceback" || true
          PYTHONIOENCODING=cp949 gdoctor graph /tmp/smoke_project 2>&1 | grep -v "^Traceback" || true
          PYTHONIOENCODING=cp949 gdoctor context /tmp/smoke_project 2>&1 | grep -v "^Traceback" || true
          echo "CP949 smoke test passed"
